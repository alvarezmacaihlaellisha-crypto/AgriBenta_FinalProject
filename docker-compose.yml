version: '3.8'

services:
  # 1. Database Container
  mongodb:
    image: mongo:4.4
    container_name: agribenta-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  # 2. Backend Node.js Container
  backend:
    build: ./agribenta-backend
    container_name: agribenta-api
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/agribenta
      - JWT_SECRET=agribenta_secret_key_123
    depends_on:
      - mongodb

volumes:
  mongo-data: